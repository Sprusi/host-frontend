server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /gym-frontend/ {
    rewrite ^/gym-frontend/(.*)$ /$1 break;
    proxy_pass http://gym-frontend:80/;
  }

  location /shop-frontend/ {
    rewrite ^/shop-frontend/(.*)$ /$1 break;
    proxy_pass http://sport-shop-frontend:80/;
  }

  location /gym-authorization-service/ {
    proxy_pass http://gym-authorization-service:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
