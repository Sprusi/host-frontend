server {
  listen 80;

location /gym-frontend/ {
  alias /path/to/gym/build/;
  try_files $uri $uri/ /gym-frontend/index.html;
}

location /sport-frontend/ {
  alias /path/to/sport/build/;
  try_files $uri $uri/ /sport-frontend/index.html;
}

location / {
  alias /path/to/host/build/;
  try_files $uri $uri/ /index.html;
}

  location /gym-authorization-service/ {
    proxy_pass http://gym-authorization-service:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
